name: OpenCode PR review
description: Review an exact GitHub PR snapshot with OpenCode and upsert a Markdown summary.
inputs:
  pr-number:
    description: Pull request number in github.repository.
    required: true
  branch:
    description: PR HEAD ref. Must equal the GitHub API head.ref.
    required: true
  skill:
    description: Exact skill ID from .opencode/skills/<id>/SKILL.md at the PR base. Omit for native /review.
    required: false
  model:
    description: OpenCode provider/model reference.
    required: false
    default: opencode/deepseek-v4.1-flash-free
  token:
    description: GitHub App installation token with contents read and pull requests write.
    required: true
    default: ${{ github.token }}
outputs:
  status:
    description: published or skipped.
    value: ${{ steps.review.outputs.status }}
  summary-url:
    description: URL of the bot-owned review summary, empty when skipped.
    value: ${{ steps.review.outputs.summary-url }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        bun install --production --frozen-lockfile --ignore-scripts
    - name: Review PR snapshot
      id: review
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_SKILL: ${{ inputs.skill }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: bun run ./src/review/index.ts
