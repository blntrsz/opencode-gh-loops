name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd src/_agent --frozen-lockfile --ignore-scripts
      - run: bun run --bun check
      - run: bun run --bun test --run
      - run: bun run smoke:failures
      - run: bun run smoke:stdin
      - run: bun run smoke:generation
      - name: Verify no compiled action artifacts
        run: |
          test -z "$(git ls-files -- dist)"
          test ! -d dist
      - name: Verify isolated TypeScript worker without inference
        run: bun run smoke
      - name: Verify source-only production action
        run: bun run smoke:action
