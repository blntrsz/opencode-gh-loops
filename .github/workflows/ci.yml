name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test --run
      - run: bun run build
      - name: Smoke-test the bundled action
        id: smoke
        uses: ./
        with:
          name: Octocat
      - name: Verify action output
        env:
          GREETING: ${{ steps.smoke.outputs.greeting }}
        run: test "$GREETING" = 'Hello, Octocat!'
